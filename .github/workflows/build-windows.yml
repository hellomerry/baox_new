name: Build Windows

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: ''

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build three clients (onedir)
        run: |
          python build.py all
        env:
          PYTHONIOENCODING: utf-8

      - name: List build output
        run: |
          Get-ChildItem dist -Recurse -Filter *.exe | Select-Object FullName, @{Name="SizeMB";Expression={[math]::Round($_.Length/1MB,2)}}

      - name: Rename version file (optional)
        run: |
          if (Test-Path resources/finance_version.txt) {
            Write-Host "Using custom version info"
          } else {
            Write-Host "No version info file, using defaults"
          }

      - name: Zip each client
        run: |
          foreach ($d in @('finance', 'auditor', 'reimburser')) {
            $name = "reimbursement_$d"
            if (Test-Path "dist/$name") {
              Compress-Archive -Path "dist/$name" -DestinationPath "dist/${name}.zip" -Force
              Write-Host "Created dist/${name}.zip"
            }
          }
        shell: bash

      - name: Create combined archive
        run: |
          Compress-Archive -Path dist/reimbursement_finance, dist/reimbursement_auditor, dist/reimbursement_reimburser -DestinationPath dist/all-windows-clients.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-clients
          path: |
            dist/reimbursement_finance.zip
            dist/reimbursement_auditor.zip
            dist/reimbursement_reimburser.zip
            dist/all-windows-clients.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/reimbursement_finance.zip
            dist/reimbursement_auditor.zip
            dist/reimbursement_reimburser.zip
            dist/all-windows-clients.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
