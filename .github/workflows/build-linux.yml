name: Build Linux

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Ubuntu 22.04 x64
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        client: [finance, auditor, reimburser]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple/
          pip install pyinstaller pywebview xlsxwriter \
              -i https://pypi.tuna.tsinghua.edu.cn/simple/

      - name: Build ${{ matrix.client }}
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python build.py ${{ matrix.client }}

      - name: Verify ELF runs
        run: |
          cd dist/reimbursement_${{ matrix.client }}
          timeout 3 ./reimbursement_${{ matrix.client }} 2>&1 | head -5
        continue-on-error: true

      - name: Package as tar.gz
        run: |
          cd dist
          tar czf reimbursement-${{ matrix.client }}-ubuntu22.04-x64.tar.gz reimbursement_${{ matrix.client }}
          ls -lh reimbursement-${{ matrix.client }}-ubuntu22.04-x64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.client }}
          path: dist/reimbursement-${{ matrix.client }}-ubuntu22.04-x64.tar.gz
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
