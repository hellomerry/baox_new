{% extends 'base.html' %}

{% block title %}报销稽核系统 - {{ client_type }}版{% endblock %}

{% block content %}
<div class="dashboard-container" id="app">
    <!-- 未登录：登录界面 -->
    <div id="login-view" class="view login-view" style="display: none;">
        <div class="login-box card">
            <h1 class="login-title">报销稽核系统</h1>
            <p class="login-subtitle">{{ client_type }}版</p>
            <form id="login-form" onsubmit="return App.handleLogin(event)">
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" id="login-username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" required autocomplete="current-password">
                </div>
                <div class="form-message" id="login-message"></div>
                <button type="submit" class="btn btn-primary btn-block">登录</button>
            </form>
        </div>
    </div>

    <!-- 已登录：主界面 -->
    <div id="main-view" class="view main-view" style="display: none;">
        <div class="content-header">
            <h2 id="view-title">工作台</h2>
            <div class="content-actions" id="content-actions"></div>
        </div>
        <div class="content-body" id="view-content">
            <p class="placeholder">加载中...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/app.js"></script>
{% endblock %}
